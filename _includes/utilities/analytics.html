{% if site.data.general_settings.google_analytics.enable and site.data.general_settings.google_analytics.key %}
  {% assign ga_key = site.data.general_settings.google_analytics.key %}
  {% if ga_key contains 'G-' %}
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_key }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ ga_key }}');
    </script>
  {% else %}
    <!-- UA 키로 보입니다. GA4 Measurement ID(G-XXXX)로 교체하세요. -->
  {% endif %}
{% endif %}
