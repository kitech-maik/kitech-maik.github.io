{%- assign rows = include.data -%}

<div class="container inner">

    <div class="row">
      <div class="col-md-10 offset-md-1">

        {%- if include.enable_search != false -%}
        <div class="mb-3">
          <input id="{{ _uid }}-filter" type="search" class="form-control" placeholder="검색: 소속/부문/이름/메일" />
        </div>
        {%- endif -%}

        <table id="{{ _uid }}-table" class="table table-hover w-100">
          <colgroup>
            <col style="width:5%">
            <col style="width:20%">
            <col style="width:30%">
            <col style="width:20%">
            <col style="width:25%">
          </colgroup>

          <thead class="table-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">소속</th>
              <th scope="col">부문</th>
              <th scope="col">이름</th>
              <th scope="col">메일</th>
            </tr>
          </thead>

          <tbody>
            {% for p in rows %}
            <tr>
              <th scope="row">{{ forloop.index }}</th>
              <td>{{ p.org }}</td>
              <td>{{ p.division }}</td>
              <td>{{ p.name }}</td>
              <td>{{ p.email }}
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

      </div>
    </div>

  </div>


{%- if include.enable_search != false -%}
<script>
(function(){
  function init(uid){
    var f=document.getElementById(uid+'-filter'), t=document.getElementById(uid+'-table');
    if(!f||!t) return;
    var rows=[].slice.call(t.querySelectorAll('tbody tr'));
    f.addEventListener('input',function(){
      var q=(this.value||'').toLowerCase().trim();
      rows.forEach(function(tr){
        var txt=[].map.call(tr.querySelectorAll('td, th[scope="row"]'), function(td){return (td.textContent||'').toLowerCase();}).join(' ');
        tr.style.display = txt.indexOf(q) > -1 ? '' : 'none';
      });
    });
  }
  function boot(){ init('{{ _uid }}'); }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
  window.addEventListener('pageshow', boot);
})();
</script>
{%- endif -%}
